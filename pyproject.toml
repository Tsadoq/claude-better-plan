
[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = [
    "tests",
    "skills/deep-plan/tests",
    "skills/design-review/tests",
    "skills/tdd-review/tests",
    "skills/product-artifacts/tests",
    "skills/product-status/tests",
    "skills/product-brief/tests",
    "skills/product-discovery/tests",
    "skills/product-requirements/tests",
    "skills/product-spec/tests",
    "skills/product-roadmap/tests",
    "skills/product-review/tests",
    "skills/product-issues/tests",
]
addopts = "--import-mode=importlib"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/lib"
files = [
    "lib",
    "skills/deep-plan/scripts",
    "skills/deep-plan/hooks",
    "skills/product-artifacts/scripts",
]
