
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lint/type/test tools
        run: pip install ruff mypy "pytest>=9,<10" tiktoken

      - name: Lint (ruff)
        run: ruff check lib skills

      - name: Type-check (mypy --strict)
        run: mypy --strict

      - name: Test (pytest)
        run: python -m pytest -v
